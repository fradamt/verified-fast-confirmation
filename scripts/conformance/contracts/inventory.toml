reason = "With fixed committees and coverage, the exact one-slot estimate forces every full-epoch slot committee to weigh total_active / SLOTS_PER_EPOCH."

[[field]]
path = "ByzantineWeightPremises.span_fraction"
file = "Economics.lean"
class = "E-network/behavior"
reason = "Non-honest stake must stay under the bound for each in-horizon slot span."

[[field]]
