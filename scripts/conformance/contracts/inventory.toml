[[field]]
path = "CheckpointInclusionView.Included"
file = "FFGState.lean"
class = "E-interpretation"
reason = "Fixed by the bridge: indexed body attestations of accepted blocks; modeling choice: indices come from the fixed committee schedule."

[[field]]
path = "CheckpointInclusionView.formed"
file = "FFGState.lean"
class = "E-interpretation"
reason = "Fixed by the bridge: the checkpoints that an accepted block carries; modeling choice: AU reads only the four carried selectors."

[[field]]
path = "CheckpointInclusionView.C"
file = "FFGState.lean"
class = "E-interpretation"
reason = "Fixed by the bridge: the committed ancestor at the epoch start slot, as get_checkpoint_block reads it."

[[field]]
path = "CheckpointInclusionView.GJ"
file = "FFGState.lean"
class = "E-interpretation"
reason = "Fixed by the bridge: realized justification of the committed state; modeling choice: a genesis-epoch checkpoint reads as the anchor (CheckpointReadsAs)."

[[field]]
path = "CheckpointInclusionView.GU"
file = "FFGState.lean"
class = "E-interpretation"
reason = "Fixed by the bridge: justification after one eager PJF copy; modeling choice: a genesis-epoch checkpoint reads as the anchor (CheckpointReadsAs)."

[[field]]
path = "CheckpointInclusionView.checkpoint_epoch"
file = "FFGState.lean"
class = "E-interpretation"
reason = "Fixed by the bridge: the selector returns the queried epoch by definition."

