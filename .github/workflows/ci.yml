name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Source provenance and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out verified-fast-confirmation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The model follows the fork tag fcr-gloas-fix (13f391516): upstream
      # 6b9bd532 plus the Gloas discount fix. The source audit reads both.
      - name: Check out pinned consensus-specs source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fradamt/consensus-specs
          ref: fcr-gloas-fix
          path: .source/consensus-specs
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # check_review_boundary.py uses `lean --deps-json`; it needs the toolchain only.
      - name: Install pinned Elan
        env:
          ELAN_VERSION: v4.2.3
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run fast deterministic validation
        run: scripts/validate.sh --fast --consensus-repo .source/consensus-specs

  lean:
    name: Lean build and trust audit
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out verified-fast-confirmation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Lake cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Install pinned Elan
        env:
          ELAN_VERSION: v4.2.3
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Restore mathlib dependency artifacts
        run: lake exe cache get

      - name: Audit facade reachability and independence with Lean's parser
        run: python3 scripts/check_imports.py

      - name: Build all project modules
        run: scripts/check_build.sh

      - name: Audit project declarations and public theorem axioms
        run: lake env lean scripts/Audit.lean

      - name: Audit Statements and derive premise field inventory
        run: |
          lake env lean scripts/StatementReachability.lean > "$RUNNER_TEMP/reachable.txt"
          cat "$RUNNER_TEMP/reachable.txt"
          python3 scripts/conformance/contracts/check_inventory.py --inventory-only --reachable-file "$RUNNER_TEMP/reachable.txt"

      - name: Audit review surface shape
        run: lake env lean scripts/ReviewSurfaceShape.lean

      - name: Require a stable dependency manifest
        run: git diff --exit-code -- lake-manifest.json

  pyspec:
    name: Pinned pyspec contracts and concrete FFG
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out verified-fast-confirmation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned consensus-specs source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fradamt/consensus-specs
          ref: fcr-gloas-fix
          path: .source/consensus-specs
          persist-credentials: false

      - name: Verify fork commit
        run: test "$(git -C .source/consensus-specs rev-parse HEAD)" = 13f391516352f61b3ac5dcaae5be1884d104f86a

      - name: Set up Python with pip cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .source/consensus-specs/pyproject.toml

      - name: Install pinned pyspec and test dependencies
        run: |
          python -m venv .source/consensus-specs/.venv
          .source/consensus-specs/.venv/bin/python -m pip install -e './.source/consensus-specs[test]'
          # The editable install does not build the fork modules; the pinned Makefile runs this step.
          (cd .source/consensus-specs && .venv/bin/python -m pysetup.generate_specs --all-forks)

      - name: Install pinned Elan
        env:
          ELAN_VERSION: v4.2.3
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Restore mathlib artifacts and build concrete FFG
        run: |
          lake exe cache get
          lake build FastConfirmationModel.Spec.BeaconChain.ConcreteTransition

      - name: Run contracts and full FFG projection
        run: python3 scripts/conformance/contracts/check_inventory.py --full --repo .source/consensus-specs --output "$RUNNER_TEMP/contracts.json"

      - name: Run realized gap regression
        run: .source/consensus-specs/.venv/bin/python scripts/conformance/contracts/test_realized_gap.py --repo .source/consensus-specs

      - name: Run concrete FFG differential
        run: .source/consensus-specs/.venv/bin/python scripts/conformance/concrete/run_differential.py --consensus-repo .source/consensus-specs
